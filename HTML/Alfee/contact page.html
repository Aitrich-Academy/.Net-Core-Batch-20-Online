<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Page</title>
</head>
<body>
    <table bgcolor="#e1cbc0" width="100%" height="100%">
        <thead>
            <tr align="center">
                <td align="center">
                    <h2><b>Aitrich News</b></h2>
                </td>
            </tr>
            <tr align="center">
                <td align="center">
                    <ul>
                        <a href="#"><font color="purple">Home</font></a> 
                        <a href="#"><font color="purple">Categories</font></a>  
                        <a href="#"><font color="purple">Articles</font></a> 
                        <a href="#"><font color="purple">Contact</font></a>
                    </ul>
                </td>
            </tr>
        </thead>
        <tbody>
            <tr align="center">
                <td align="center">
                    <h3>Contact Form</h3>
                </td>
            </tr>
            
                <form>
                    <tr align="center">
                        <td>Name:<br>
                           <input type="text">
                        </td>
                    </tr>
                    <tr align="center">
                        <td>Email:<br>
                           <input type="email">
                        </td>
                    </tr>
                    <tr align="center">
                        <td>Phone:<br>
                           <input type="tel">
                        </td>
                    </tr>
                    <tr align="center">
                        <td>Subject:<br>
                           <input type="text">
                        </td>
                    </tr>
                    <tr align="center">
                        <td>Message:<br>
                           <textarea></textarea>
                        </td>
                    </tr>
                    <tr align="center">
                        <td>Country:<br>
                           <input type="text">
                        </td>
                    </tr>
                    <tr align="center">
                        <td>City:<br>
                           <input type="text">
                        </td>
                    </tr>
                    <tr align="center">
                        <td>Address:<br>
                           <input type="text">
                        </td>
                    </tr>
                    <tr align="center">
                        <td>Zipcode:<br>
                           <input type="text">
                        </td>
                    </tr>
                    <tr align="center">
                        <td>Occupation:<br>
                           <input type="text">
                        </td>
                    </tr>
                    <tr align="center">
                        <td><br>
                           <button type="send">Send</button>
                        </td>
                    </tr>
                </form>
            
            <tr align="center">
                <td align="center">
                    &copy;News Website
                </td>
            </tr> 
        </tbody>
    </table>

</html>
