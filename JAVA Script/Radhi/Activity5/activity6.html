    <script>
        //Write a function to check if a number is positive, negative, or zero
        function check()
        {
            let n=parseInt(prompt("enter anumber"))
            if(n>0)
            {
              document.write("Number is poisitve");
            }
            else if(n==0)
            {
                document.write("NUmber is Zero");
            }
            else{
                document.write("Number is Negative")
            }
        }
        check();

    </script>
