<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
      //  Write a function that returns the square of a number
      
      
      function square(num)
      {
        return num*num;
      }
         
      
      document.write(square(3)+ "<br>");
      //Write a function to find the square of a given number.

      function sq()
      {
       let  n=parseInt(prompt("enter a number to find square"))
        document.write(n*n);
      }
      sq();
    </script>
</body>
</html>
