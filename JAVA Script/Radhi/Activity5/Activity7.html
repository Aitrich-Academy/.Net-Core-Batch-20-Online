    <script>
       //Write a function that returns the sum of numbers from 1 to N
       function sumUpToN(n) {
    let sum = 0;
    for (let i = 1; i <= n; i++) {
        sum += i;
    }
    return sum;
}

console.log(sumUpToN(5)); 

    </script>
