<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <Script>
        let numbers=[21,22,23,24,25];
       let x= numbers.length
       document.write("length of the array is:",x +"<br>");
       
       document.write("Third number of array is:",numbers[3]+"<br>");
       numbers.push(prompt("enter the number for push"));
        numbers[2]=prompt("enter the 2nd number");
       document.write("The array numbers are:",numbers + "<br>");
       numbers.pop();
       document.write("The array numbers are:",numbers + "<br>");
       numbers.splice(1,2);
       document.write("The array numbers are:",numbers + "<br>");
    </Script>
</body>
</html>
