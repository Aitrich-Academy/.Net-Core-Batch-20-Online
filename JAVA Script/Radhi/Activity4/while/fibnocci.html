<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

        // fibonacci series
        let limit=parseInt(prompt("enter a limit "));
        let number1=0;
        let secondnumber=1;
        let i=1;
        let sum=0;
        let s=0;
        document.write(number1 +" " + secondnumber + " ");
        while(i<limit)      
    {
        
         sum=s+secondnumber;
        document.write(sum +" ");
        s=secondnumber;
        secondnumber=sum;
        i++;
    }


    </script>
    
</body>
</html>
