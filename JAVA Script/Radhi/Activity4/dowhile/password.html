<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //Keep asking for a password until the correct one is entered.
         let cpd="password"
         let pd;
         do{
            pd=(prompt("enter the password"))
            if(pd===cpd)
         {
            document.write("login successfully ");
         }
         }while(pd!==cpd)
         
    </script>
</body>
</html>
