<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let marks=parseInt(prompt("enter the total marks"));
        switch(true)
    {
        case (marks>=90):
            
        document.write("A grade");
        break
    
    case (marks>=80):
    
        document.write("B grade");
         break;
    case (marks>=70):
    
        document.write("c grade");
        break;
    
    case (marks>=60):
        document.write("D grade");
        break;
        default:
        document.write("Failed");
    }
    </script>
</body>
</html>
