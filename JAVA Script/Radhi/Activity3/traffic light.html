<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let choice = parseInt(prompt("Enter your choice:\n1 - Red\n2 - Yellow\n3 - Green\n4 - Exit"));
    

         switch(choice)
         {
            case 1:
                document.write("Red Light - STOP!");
                break;
            case 2:
                document.write("Yellow Light - GET READY!");
                break;
            case 3:
                document.write("Green Light - GO!");
                break;
                default:
                document.write("exit the program");
         }
     

        
    </script>
</body>
</html>
