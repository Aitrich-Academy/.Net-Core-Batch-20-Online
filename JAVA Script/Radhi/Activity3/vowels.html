<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let l=prompt("enter a letter in alphabets").toLowerCase();
        switch(l)
        {
                case "a":
                case "e":
                case "i":
                case "o":
                case "u":
                document.write(l," is a vowel.");
                break;
                default:
                document.write(l," is not vowel.");

        }
    </script>
</body>
</html>
