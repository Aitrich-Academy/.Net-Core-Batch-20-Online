<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
         let choice = parseInt(prompt("Enter your choice:\n1 -Sunday\n2 -Monday\n3 -Tuesday\n4 -wednesday\n5 -Thuresday\n6 -Friday\n7 -Saturday "));
    

    switch(choice)
    {
        
            case 1:
                document.write("Puttum Kadala curry");
                break;
            case 2:
                document.write("Appam Egg curry");
                break;
            case 3:
                document.write("Ediyappam vegkurumacurry");
                break;
                
            case 4:
                document.write("iddaly chutany");
                break;
            case 5:
                document.write("chappathi curry");
                break;
            case 6:
                document.write("Uppumavu");
                break;
            case 7:
                document.write("dhosha Sambar");
                break;

                default:
                document.write("exit the program");
         }
    
    </script>
</body>
</html>
