<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let n=parseInt(prompt("enter a number"));
        if(n%3==0 && n%5==0)
    {
        document.write("FizzBuzz");
    }
    else if(n%3==0)
    {
        document.write("Fizz");
    }
    else if(n%5==0)
    {
        document.write("Buzz");
    }
    else
    {
    
        document.write("not divisible ");
    
    }
    </script>
</body>
</html>
