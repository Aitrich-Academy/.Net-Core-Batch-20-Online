<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Job Application Form</h2>
    <form>
        <label>Full Name:</label>
        <input type="text" id="fullName" name="fullName" pattern="/^[A-Za-z\s]+$/;" required ><br><br>

        <label>Email:</label>
        <input type="text" id="email" name="email" pattern="/^[^\s@]+@[^\s@]+\.[^\s@]+$/" required><br><br>

        <label>Phone Number:</label>
        <input type="text" id="phone" name="phone" pattern="/^\d{10}$/;"><br><br>

        <label>Date of Birth:</label>
        <input type="text" id="dob" name="dob"><br><br>

        <label>Upload Resume:</label>
        <input type="text" id="resume" name="resume" pattern=" /(\.pdf|\.docx)$/i;"><br><br>

        <label>Experience (Years):</label>
        <input type="text" id="experience" name="experience"><br><br>

        <label>Preferred Location:</label>
        <input type="text" id="location" name="location"><br><br>

        <label>Portfolio Link (Optional):</label>
        <input type="text" id="portfolio" name="portfolio" pattern="/^(https?:\/\/)?([\w\-]+\.)+[\w]{2,}(\/\S*)?$/;"><br><br>

        <label>Gender:</label>
        <input type="radio" name="gender" value="Male">Male
        <input type="radio" name="gender" value="Female">Female
        <input type="radio" name="gender" value="Other">Other
        <br><br>

        <input type="checkbox" id="terms" name="terms">
        <label for="terms">I agree to the Terms & Conditions</label><br><br>

        <button type="submit">Submit Application</button>
    </form>
</body>
</html>
