<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button id="countButton">Click me:0</button>
    <script>
        let count = 0;
        let c=document.getElementById("countButton")

        c.onclick=function()
        {
            count++;
            c.innerHTML=`Click me:  ${count}`;
        }
       
    </script>
</body>
</html>
