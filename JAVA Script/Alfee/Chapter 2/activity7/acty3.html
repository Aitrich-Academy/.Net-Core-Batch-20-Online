<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="mypara">JavaScript is a scripting language that enables you to create dynamically updating content, control multimedia, animate images, and pretty much everything else.</p>
    <button id="mybtn">Hide</button>
    <script>
        let paragraph=document.getElementById("mypara")
        document.getElementById("mybtn").onclick=function()
        {
            if(paragraph.style.display==="none")
        {
            paragraph.style.display="block";

        }
        else
        {
            paragraph.style.display="none";
        }
        }

    </script>
</body>
</html>
