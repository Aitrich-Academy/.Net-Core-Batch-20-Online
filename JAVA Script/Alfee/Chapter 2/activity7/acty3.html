<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="mypara">This is a paragraph that will be toggled on button click</p>
    <button id="mybtn">Click Here</button>
    <script>
        document.getElementById("mybtn").onclick=function()
        {
            document.getElementById("mypara").innerHTML="hidden"
        }

    </script>
</body>
</html>
