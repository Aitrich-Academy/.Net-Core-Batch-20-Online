    <!-- 2.Print even numbers from 2 to 20 using a while loop? -->

    <script>
      let num = 2;
      while (num < 20) 
      {
        if(num%2==0)
      {
        document.write(num +"<br>");
      }
       // even number kand pidian if 
        num++;
      }
    </script>
