<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let num = prompt("enter any digits");  
      let sum = 0;
      let i = 0;
      while (i < num.length) {
        sum += +num[i];
        i++;
      }
      document.write(sum);
    </script>
  </body>
</html>
