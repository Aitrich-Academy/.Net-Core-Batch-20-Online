<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let number;

      do {
        number = parseInt(prompt("Enter a number"));
        if (number >= 0) {
          document.write("entered:", number+"<br>");
        }
      } while (number >= 0);
      document.write("negative"+"<br>");

    </script>
  </body>
</html>
