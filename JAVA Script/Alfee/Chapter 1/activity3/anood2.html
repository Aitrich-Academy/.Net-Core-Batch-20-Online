<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
    // 2.Write a program that implements dynamic discount?

    let amount=parseFloat(prompt("enter amount"));
    let membership=prompt("enter membership");
    let convert_discount_to_decimal=0;
    let calculate_amount=0;
    let discount_amount;

    switch(membership)
    {
        case "Regular":
            convert_discount_to_decimal=5/100;
            calculate_amount=amount*convert_discount_to_decimal;
            discount_amount=amount- calculate_amount;
            document.write("You are a regular customer so you can pay"+discount_amount ,"Rs");
            break;
        case 2:
             document.write(10);
            break; 
        case 3:
            document.write(20);
             break;
        case 4:
            document.write(30); 
            break;
        default:
            document.write("invalid");   
     }
    </script>
</body>
</html>
