<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
         // 2.Use switch to check if a letter is a vowel?

        let vowels=prompt("enter any letters");

        switch(vowels)
        {
            case "a":
            case "e":
            case "i":
            case "o":
            case "u":
                document.write("vowel");
                break;
            default:
                document.write("not a vowel");
        }
    </script>
</body>
</html>
