<!DOCTYPE html>
<html lang="en">

<body>
    <script>
    // 3.Write a loop to reverse a given string?

    let string=prompt("enter any words");
    let reversed="";

    for(let i=string.length-1;i >= 0; i--)
    {
        reversed += string[i];
    }
        document.write(reversed);

    </script>
</body>
</html>
