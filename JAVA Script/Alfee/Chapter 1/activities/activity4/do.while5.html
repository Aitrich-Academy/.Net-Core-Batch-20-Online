<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let sum=0;
        let num;
        do {
            num = parseFloat(prompt("Enter a positive number"));
            if(num>=0)
            {
              sum+=num;
            }
           }  
           while (num >= 0)
           document.write(sum);

    </script>
</body>
</html>
