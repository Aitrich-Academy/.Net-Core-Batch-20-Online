<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let num=prompt("enter any digits");
        let reversed="";
        let i= num.length - 1;
        while(i>=0)
    {
        reversed += num[i];
        i--;  
    }
    if(num===reversed)
    {
        document.write(num+ "is a palindrome");
    }
    else
    {
        document.write(num+ "is  not a palindrome");
    }
    </script>
</body>
</html>
