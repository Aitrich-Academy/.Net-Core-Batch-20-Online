<body>
    <script>
         // 3.Calculate the factorial using for loop?

        let num=prompt("enter any number");
        let result=1;
        for(let i=1;i<=num;i++)
           {
            result*=i;

           }
           {
            document.write(result);

           }
    </script>
</body>
