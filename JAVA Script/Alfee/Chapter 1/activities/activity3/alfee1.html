<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // 1.Write a program to show of changing traffic light signal using switch?

         let signal=prompt("display the lights")

         switch(signal)
         {
             case "red":
                document.write("The light show the vehicles to stop");
                break;
             case "yellow":
                document.write("The light show the vehicles to wait");
                break; 
             case "green":
                document.write("The light show the vehicles to move");
                break;
             default:
                 document.write("invalid");   
         }
    </script>
</body>
</html>
