<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
       // 1.Write a program that checks number divisiblity?

    let num=prompt("enter any numbers");

    if(num%3==0 && num%5==0)
    {
        document.write("FizzBuzz")

    }
    else if(num%3==0)
    {
        document.write("Fizz")
    }
    else if(num%5==0)
    {
        document.write("Buzz")
    }
    else
    {
        document.write(num)
    }
    </script>
</body>
</html>
