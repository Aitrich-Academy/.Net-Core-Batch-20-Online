<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<body>
    <script>
// 1. Check if a given number is prime or not using a for loop?

let prime=prompt("enter any digit");

for(let i=2; i<=prime; i++)
{
if(prime % i==0)

{
    document.write(prime + " is not a prime number.");
    break;
}

else
{
    document.write(prime + " is  a prime number.");
    break;
}

}

  
    </script>
</body>
</html>
