<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
    // 1.Write a program that prints multiplication table of a given number?

    let num=prompt("enter any number");

    for(let i=1;i<=16;i++)
  {
    document.write(num +"x"+ i + "=" + (num*i) +"<br>");
  }
    </script>
</body>
</html>
