<body>
    <script>
// 1. Write a program that takes a number as input and checks whether it is positive,negative,or zero using an if else if statement?

let num=prompt("enter any numbers");

if (num > 0) 
{
    document.write("The number is Positive.");
}

else if(num<0)
{
    document.write("The number is Negative.");
}

else
{
    document.write("The number is Zero.");
}

    </script>
</body>
