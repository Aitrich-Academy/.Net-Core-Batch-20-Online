<body>
    <script>
// 1.Write a program to takes  a students score and prints the grade using the following rules?

let score =prompt("enter a value");

if(score>=90)
    {
       document.write("A");
    }

else if(score>=80)
{
    document.write("B");
}

else if(score>=70)
{
    document.write("C");
}

else if(score>=60)
{
    document.write("D");
}

else
{
    document.write("F");
}
    </script>
</body>
</html>
