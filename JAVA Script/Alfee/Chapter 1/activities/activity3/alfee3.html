<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // 3.Write a program to sum of first n even numbers in loop?

        let n=parseInt(prompt("enter any number"));
       
        let sum=0;

        for(let i=1;i<=n;i++)
        {
            if(i%2==0)   
            {
               sum=sum+i
            }     
        }
           document.write(sum);
       
    </script>
</body>
</html>
