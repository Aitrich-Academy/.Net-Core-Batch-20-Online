<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function Palindrome(str) 
        {
          let reversed = str.split('').reverse().join('');
          return str === reversed;
        }
        document.write("Is Palindrome ('madam'): " + Palindrome("madam") + "<br>");
        document.write("Is Palindrome ('hello'): " + Palindrome("hello") + "<br>");
    </script>
</body>
</html>
