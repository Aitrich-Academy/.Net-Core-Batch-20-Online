    <script>
    function convertToUpperCase(str) 
    {
    return str.toUpperCase();
    }
document.write("Uppercase ('hello'): " + convertToUpperCase("hello") + "<br>");
document.write("Uppercase ('javascript'): " + convertToUpperCase("javascript") + "<br>");
    </script>
