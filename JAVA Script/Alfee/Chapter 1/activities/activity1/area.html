<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Work 5</title>
  </head>
  <body>
    <h2>Swap two variables and print</h2>
    <script>
      let a = 10;
      let b = 20;
      document.write("Before:a=" + a + " b=" + b+"<br>");

      let c = a;
      a = b;
      b = c;
      document.write("After:a=" + a + " b=" + b);
    </script>
  </body>
</html>
