<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
         // 1.Create an array of 6 elements.

         let colors=["Green","White","Red","Brown","Blue","Black"];
         document.write(colors+"<br>");
         alert("open it");

        //  2.Use splice, to insert three new colors at the second position in an array.

         colors.splice(1,0, "Yellow","Pink","Grey");
         document.write(colors+"<br>");

        //  3.Reverse an array and display the result.

        colors.reverse();
        document.write(colors+"<br>");
    </script>
</body>
</html>
