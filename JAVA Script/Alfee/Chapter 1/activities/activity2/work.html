<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // 1.Create an array of five elements.

        let fruits=["Apple","Banana","Grapes","Pineapple","Orange"];
        document.write(fruits+"<br>");
        alert("open it");

        // 2.Find length of array?

         document.write("Length of array:" + fruits.length + "<br>");

        // 3.Display the 3rd element of the array.

        document.write("3rd element:" + fruits[2] +"<br>");
        
        // 4.Add two more elements by using different methods.

        fruits.push("Papaya");
        document.write(fruits +"<br>");

        fruits.unshift("Anar");
        document.write(fruits +"<br>");

        // 5.Delete the first element of the array.

        fruits.shift();
        document.write(fruits +"<br>");

        // 6.Delete the last element of the array.

        fruits.pop();
        document.write(fruits +"<br>");

       // 7.Delete the elements using splice method.

       fruits.splice(1,2);
       document.write(fruits +"<br>");

    </script>
</body>
</html>
