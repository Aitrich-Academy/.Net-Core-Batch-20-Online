<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swap two variables</title>
</head>
<body>

    <script>
        let a=5;
        let b=15;
        document.write("Before swap a=",a ,   "b=",b);
        let temp=a;
        a=b;
        b=temp;
        document.write("After swap a=",a,"b=",b)
    </script>
    
</body>
</html>
