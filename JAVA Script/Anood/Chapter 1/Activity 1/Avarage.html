<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avarage of three numbers</title>
</head>
<body>
    <script>
        let num1=6; 
        document.write("num1:",num1);
        let num2=12;
        document.write("num2:",num2);
        let num3=18;
        document.write("num3:",num3);
        let avarege=(num1+num2+num3)/3;
        document.write("Avarage:",avarege);
    </script>
    
</body>
</html>
