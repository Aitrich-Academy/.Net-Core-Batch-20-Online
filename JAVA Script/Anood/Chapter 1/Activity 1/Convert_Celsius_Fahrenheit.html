    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convert Celsius to Fahrenheit</title>
</head>
<body>
    <script>
    let celsius=30;
    let Fahrenheit;
    Fahrenheit=(celsius*9/5)+32;
    document.write(celsius + "C in Farhenheit is :" + Fahrenheit + "F");
    </script>
</body>
