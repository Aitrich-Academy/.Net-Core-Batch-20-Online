<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Square root of a number</title>
</head>
<body>

    <script>
        let num=4;
        let squarerootnum;
        squarerootnum=Math.sqrt(num);
        document.write("Square root of number 4 is :" + squarerootnum);
    </script>
    
</body>
</html>
