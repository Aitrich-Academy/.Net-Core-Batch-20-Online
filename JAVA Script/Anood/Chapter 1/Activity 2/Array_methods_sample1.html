<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array and Methods 1</title>
</head>
<body>

    <script>
        const fruits = ["Apple", "Banana", "Cherry", "Dragonfruit" ,"Eggplants"];
        document.write(fruits + "<br>");

        let length =fruits.length;
        document.write(length + "<br>");

        let thirditem = fruits[2];
        document.write(thirditem + "<br>");

        fruits.push("Fig");
        document.write(fruits + "<br>");

        fruits.unshift("Grapes");
        document.write(fruits + "<br>");

        fruits.shift();
        document.write(fruits + "<br>");

        fruits.pop();
        document.write(fruits + "<br>");

        fruits.splice(3);
        document.write(fruits + "<br>");



    </script>
    
</body>
</html>
