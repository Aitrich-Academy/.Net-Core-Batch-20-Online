<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keep asking for a number until it is a prime number.</title>
</head>
<body>
    <script>
        
        function isPrime(num) {
    if (num < 2) return false;
    for (let i = 2; i <= Math.sqrt(num); i++) {
        if (num % i === 0) return false;
    }
    return true;
}

do {
    var userInput = parseInt(prompt("Enter a prime number:"), 10);
} while (!isPrime(userInput));

document.write("You entered a prime number: " + userInput);








    </script>
</body>
</html>
