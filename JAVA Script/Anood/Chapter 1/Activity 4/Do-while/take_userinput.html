<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Take user input until they enter a negative number.</title>
</head>
<body>
    <script>
        let number;

do 
{
    number = parseInt(prompt("Enter a number (enter a negative number to stop):"), 10);
    
    if (!isNaN(number) && number >= 0)
     {
        document.write("You entered:", number + "<br>");
    }

}
 while (!isNaN(number) && number >= 0);

document.write("Negative number entered. Exiting...");

    </script>
</body>
</html>
