<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keep asking for a password until the correct one is entered.</title>
</head>
<body>
    <script>
        const correctPassword = "mypassword"; // Set the correct password
let userInput;
 
do {
    userInput = prompt("Enter the password:");
} while (userInput !== correctPassword);

alert("Access granted!");

    </script>
</body>
</html>
