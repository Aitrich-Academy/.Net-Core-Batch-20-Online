<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Print the first N odd numbers using a do-while loop.</title>
</head>
<body>
    <script>
        let N=parseInt(prompt("Type how many odd number you want"))
        let count = 0;
        let num = 1;

    do {
        document.write(num + "<br>");
        num += 2;  // Increment by 2 to get the next odd number
        count++;
    } while (count < N);

    </script>
</body>
</html>
