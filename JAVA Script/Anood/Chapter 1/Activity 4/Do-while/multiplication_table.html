<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Print a multiplication table of a given number</title>
</head>
<body>
    <script>
        let number = parseInt(prompt("Enter a number to print its multiplication table: "), 10);
let i = 1; 

 

do {
    document.write(number + "x" +  i + "="  + number * i + "<br>");
    i++;
} while (i <= 10);  

    </script>
</body>
</html>
