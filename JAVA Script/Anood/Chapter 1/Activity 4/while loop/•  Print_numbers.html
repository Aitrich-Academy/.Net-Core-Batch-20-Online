<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Print numbers from 1 to 10 using a while loop.</title>
</head>
<body>
    <script>
    //    let i=1;
    let i=parseInt(prompt("Enter a number"));
       while(i<=10)
       {
         
            document.write(i + "<br>");
         
          i ++
       }
    </script>
</body>
</html>
