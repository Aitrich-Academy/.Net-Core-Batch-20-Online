<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sum of first N natural numbers </title>
</head>
<body>
    <script>
        let num=parseInt(prompt("Enter number"));
        let sum=0;
        let i=0;
        while(i<=num)
               {
                sum += i;
                 i++; 
               }
               document.write("The sum of " + num + "natural number is" + sum); 
    
    </script>
</body>
</html>
