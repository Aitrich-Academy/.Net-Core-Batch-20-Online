<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Print even numbers from 2 to 20 using a while loop.</title>
</head>
<body>
    <script>
        let i= 0;
        while(i<=19)
        {
            i += 2;
            document.write(i + "<br>");  
        }
    </script>
    
</body>
</html>
