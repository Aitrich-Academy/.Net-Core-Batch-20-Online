<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find the factorial of a given number</title>
</head>
<body>

    <script>
        let num=parseInt(prompt("Enter number"));
        let i=1;
        let fact=1;
        while(i<= num)
    {
        fact=fact*i;
        i ++;
    }

    document.write("The factorial of num is " + fact);
    </script>
    
</body>
</html>
