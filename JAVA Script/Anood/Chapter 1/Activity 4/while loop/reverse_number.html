<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reverse a number </title>
</head>
<body>
    <script>
        let number=parseInt(prompt("Enter a number"));
        let num=number.toString();
        let rev_num="";
        let i=0;
        while(i<num.length)
         
        {
        rev_num=num[i] + rev_num;
        i++;
        }

        document.write("The reverse number of " + number + "" + "is" +  ""  + rev_num)
    </script>
</body>
</html>
