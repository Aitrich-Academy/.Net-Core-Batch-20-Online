<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Write a function to calculate the area of a rectangle given its length and width.</title>
</head>
<body>
    <script>
        function area(length,width)
        {
            return(length*width);
        }
      document.write(area(20,4));
    </script>
</body>
</html>
