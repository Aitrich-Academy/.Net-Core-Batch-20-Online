    <title>Create a function that finds the maximum of two numbers.
    </title>
</head>
<body>
    <script>
        function chkmaximun(num1,num2)
        {
            if(num1>num2)
        {
            return(num1 + "is the biggest number")
        }
        else
        {
            return(num2 + "is the biggest number")
        }
        }

        document.write(chkmaximun(7,24));
    </script>
