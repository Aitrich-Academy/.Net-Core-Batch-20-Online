<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Write a function to find the square of a given number.</title>
</head>
<body>
    <script>
        function chksquare(number)
        {
            return number*number;
        }

        document.write(chksquare(9));

    </script>
</body>
</html>
