<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Write a function that takes a name as input and returns a greeting message (e.g., "Hello, John!").</title>
</head>
<body>

    <script>
        function hello(name)
        { 
                return "Hello, " + name + "!";  
        }

         document.write(hello("Anu"));
    </script>
    
</body>
</html>
