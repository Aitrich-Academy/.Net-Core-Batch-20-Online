<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Function to Calculate Factorial of a Number
    </title>
</head>
<body>
    <script>
         function factorialIterative(n) 
         {
    if (n < 0) return  
    let result = 1;
    for (let i = 2; i <= n; i++) {
        result *= i;
    }
    return result;
}

document.write(factorialIterative(7));
    </script>
</body>
</html>
