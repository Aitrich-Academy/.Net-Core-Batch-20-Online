<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Write a function to add two numbers and return the result. </title>
</head>
<body>
    <script>
        function addNumbers(num1, num2) 
        {
              return num1 + num2;
        }

            let result = addNumbers(15, 25);
           document.write("Sum obtained from the function (): " + result);
    </script>
</body>
</html>
