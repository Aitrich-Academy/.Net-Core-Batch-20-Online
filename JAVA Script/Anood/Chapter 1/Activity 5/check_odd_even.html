<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Write a function that takes a number as input and returns "Even" or "Odd".</title>
</head>
<body>
    <script>
        function evenOrOdd(number)
         {
    
            return number % 2 === 0 ? "Even" : "Odd";

        }

        document.write(evenOrOdd(5));  
         
    </script>
</body>
</html>
