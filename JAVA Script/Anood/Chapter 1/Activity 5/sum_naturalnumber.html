<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Write a function that returns the sum of numbers from 1 to N</title>
</head>
<body>
    <script>
        function sumNaturalNumbers(n) 
        {
          let sum = 0;
       for (let i = 1; i <= n; i++) 
    
          {
            sum += i;
         }
           return sum;
}

          document.write(sumNaturalNumbers(20)); 
    </script>
</body>
</html>
