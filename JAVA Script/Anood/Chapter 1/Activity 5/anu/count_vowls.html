<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Write a function countVowels(str) that returns the number of vowels in a given string.
    </title>
</head>
<body>
    <script>
        function countVowel(str) 
        { 
         const count = str.match(/[aeiou]/gi).length;
         return count;
     }
      document.write(countVowel("owl"));
    </script>
</body>
</html>
