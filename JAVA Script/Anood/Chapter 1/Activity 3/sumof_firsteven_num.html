<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

        let sum = 0;
        let n=parseFloat(prompt("Enter number"));
             for (let i = 1; i <= n; i++) 
             { 
               sum += 2 * i;  
             }
            document.write("The sum of first" + n + " even number is " + sum);
    </script>
</body>
</html>
