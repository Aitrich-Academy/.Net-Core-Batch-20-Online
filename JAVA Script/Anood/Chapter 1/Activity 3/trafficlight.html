<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        
        let colour = prompt("Enter colour ( Either Red ,Yellow, Green ): ");

    
        switch(colour)
        {
            case "Red" :
            document.write("Signal colur is Red....Stop the car now!!!!");
            break;

            case "Yellow" :
            document.write("Signal colur is Yellow....Slow down and stop!!!!");
            break;

            case "Green" :
            document.write("Signal colur is Green....Go and drive carefully!!!!");
            break;

            default:
            document.write('Invalid colour');
            break;
        }

    </script>

</body>
</html>
