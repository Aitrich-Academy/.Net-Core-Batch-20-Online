<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Reverse a String
    </title>
</head>
<body>
    <script>
        let str=prompt("Enter word or sentence") ;
        let reversed = ''; 

   
        
    for (let i = str.length - 1; i >= 0; i--) 
    {
        reversed += str[i]; // Add each character to the reversed string
    }

    document.write("The reverse word of "  + str +  " " + "is"  + " " + reversed);
 
    </script>
</body>
</html>
