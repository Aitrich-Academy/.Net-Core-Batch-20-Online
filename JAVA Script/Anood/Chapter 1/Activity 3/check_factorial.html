<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculate the factoroial of given number using for loop</title>
</head>
<body>
    <script>
        let n=parseInt(prompt("Enter number"));
        let result=1 ;
    
       
         
        for (let i = 1; i <= n; i++)
        {
            result *=i;
           
        }
        
        document.write("The factorial of " + n + " " + " is" + " " + result);
        
    </script>
</body>
</html>
