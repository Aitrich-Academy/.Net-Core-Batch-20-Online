<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
 

        let number=prompt("Enter a number");

        if (isNaN(number))
         {
        document.write("Invalid input. Please enter a valid number.")
         }
         else
         {
            if (number == 0)
             {
                document.write("The number " + number + " is zero.");
             } 
             else if (number == Math.abs(number))
              {
                document.write("The number " + number + " is positive.");
              }
               else
                {
                    document.write("The number  " + number + " is negative.");
               }
         }

    </script>
</body>
</html>
