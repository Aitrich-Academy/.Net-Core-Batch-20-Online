<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>seven days breakfast using switch case
    </title>
</head>
<body>
    <script>

        let day = prompt("Please enter a number between 1 and 7.");

        switch(day) 
        {
        case "1":
        document.write("Monday: Pancakes with honey");
            break;
        case "2":
        document.write("Tuesday: Scrambled eggs with toast");
            break;
        case "3":
        document.write("Wednesday: Oatmeal with fruits");
            break;
        case "4":
        document.write("Thursday: French toast with syrup");
            break;
        case "5":
        document.write("Friday: Cereal with milk");
            break;
        case "6":
        document.write("Saturday: Waffles with strawberries");
            break;
        case "7":
        document.write("Sunday: Omelette with cheese");
            break;
        default:
        document.write("Invalid input! Please enter a number between 1 and 7.");
    }

</script>
</body>
</html>
