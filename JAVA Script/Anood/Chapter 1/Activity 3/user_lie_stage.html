<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
 

        let age=parseFloat(prompt("Enter age"));

            if (age < 13)
             {
                document.write("The age category is child");
             } 
             else if ( age >= 13 && age <= 19)
               {
                document.write("The age category is Teenager");
              }
              else if (  age >= 20 && age <= 64)
              {
                document.write("The age category is Adult");
              }
               else
                {
                document.write("The age category is Senior");
               }
         

    </script>
</body>
</html>
