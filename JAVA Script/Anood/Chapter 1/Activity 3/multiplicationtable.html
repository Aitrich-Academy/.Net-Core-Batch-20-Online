<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplication Table</title>
</head>
<body>

    <script>
        let userNumber = prompt("Enter a number to generate its multiplication table:");
        let validatedNumber = parseInt(userNumber, 10);
        if (validatedNumber)
        {
           document.write("Multiplication Table for " + validatedNumber + "<br>");
           for (let i = 1; i <= 10; i++)
            {
            document.write(validatedNumber + "*" ,i + "=", validatedNumber * i + "<br>");
            }
           }
          
        else
         {
            document.write("Please enter a valid number.");
         }
    </script>
    
</body>
</html>
