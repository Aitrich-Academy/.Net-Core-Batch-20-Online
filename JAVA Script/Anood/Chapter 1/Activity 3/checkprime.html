<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let n = prompt("Enter a number");
        let isPrime = true;

         if (n <= 1)
          {
         isPrime = false;
          } 
          else
           {
             for (let i = 2; i * i <= n; i++)
              {
              if (n % i === 0) 
              {
            isPrime = false;
            break;
           }
          }
        }

        if(isPrime==true)
        {
            document.write("The given number "+ n + "is Prime number!!!");
        }
        else
        {
            document.write("The given number "+ n + "is not Prime number!!!");
        }
        
    </script>
</body>
</html>
