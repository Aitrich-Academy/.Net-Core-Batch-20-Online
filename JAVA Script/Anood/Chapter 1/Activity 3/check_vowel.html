<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Use switch to determine if a letter is a vowel 
    </title>
</head>
<body>
    <script>
        let letter=prompt("Enter a letter");

        switch(letter) 
        {
        case "a":
        document.write("This is a vowel.it vowels represent sounds where the vocal tract remains open");
            break;
        case "e":
        document.write("This is a vowel.it vowels represent sounds where the vocal tract remains open");
            break;
        case "i":
        document.write("This is a vowel.it vowels represent sounds where the vocal tract remains open");
            break;
        case "o":
        document.write("This is a vowel.it vowels represent sounds where the vocal tract remains open");
            break;
        case "u":
        document.write("This is a vowel.it vowels represent sounds where the vocal tract remains open");
            break;
        
        default:
        document.write("this is not a vowel letter.it is a consonants.It consonants represent sounds with a closure of the vocal tract");
    }

    </script>
</body>
</html>
