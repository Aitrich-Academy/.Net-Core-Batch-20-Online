<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        text-align: center;
      }

      input,
      button {
        padding: 10px;
        font-size: 15px;
      }

      button {
        cursor: pointer;
        background-color: brown;
        color: whitesmoke;
        border-radius: 5px;
      }

      button:hover {
        background-color: blue;
      }

      ul {
        list-style: none;
        padding: 0;
      }

      li {
        background: color #f2f2ff;
        margin: 5px;
        padding: 10px;
        border-radius: 5px;
        display: inline-flex;
        width: 50px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <input type="number" id="numberInput" placeholder="enter a number" />
    <button onclick="addNumber()">Add Number</button>
    <button onclick="sortList(increase)">Sort Ascending</button>
    <button onclick="sortList(decrease)">Sort Descending</button>
    <ul id="numList"></ul>

    <script>
      function addNumber() {
        let num = document.getElementById("numberInput").value;
        if (num) {
          let li = document.createElement("li");
          li.textContent = num;
          document.getElementById("numList").appendChild(li);
          numberInput.value = "";
        }
      }

      function sortList(ascending) {

              )

    </script>
  </body>
</html>
