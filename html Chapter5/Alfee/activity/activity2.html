<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table bgcolor="#b6ded7">
        <form>
            <h2>Personal Details</h2>
            <tr>
                <td>Name:</td>
                <td><input type="text"></td>
            </tr>
            <tr>
                <td>Password</td>
                <td><input type="password"></td>
            </tr>
            <tr>
                <td>Email id</td>
                <td><input type="email"></td>
            </tr>
            <tr>
                <td>Personal Website</td>
                <td><input type="url" name="w3schools" value="https://www.w3schools.com/"></td>
            </tr>
            <tr>
                <td>Gender:</td>
                <td><input type="radio" name="Gender">Male
                    <input type="radio" name="Gender">Female</td>
            </tr>
            <tr>
                <td>Date of Birth</td>
                <td><input type="date" name="date of birth"></td>
            </tr>
            <tr>
                <td>Color</td>
                <td><input type="color"></td>
            </tr>
            <tr>
                <td>Search here</td>
                <td><input type="search"></td>
            </tr>
            <tr>
                <td>Datetime</td>
                <td><input type="datetime" name="datetime" value="2025-01-25 10:00:00"></td>
            </tr>
            <tr>
                <td>Month</td>
                <td><input type="month" name="month" value="2025-01"></td>
            </tr>
            <tr>
                <td>Week</td>
                <td><input type="week" name="week" value="2025-W04"></td>
            </tr>
            <tr>
                <td>Contacts</td>
                <td><input type="text"></td>
            </tr>
            <tr>
                <td>Phone No.</td>
                <td><input type="tel" name="phone" placeholder="123-456-789"></td>
            </tr>
            <tr>
                <td>Course</td>
                <td>
                    <select>
                        <option>Bachelor of Arts</option>
                        <option>Bachelor of Comerce</option>
                        <option>Bachelor of Science</option>
                        <option>Bachelor of Vocatinal</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Bachelor of Science</td>
                <td>
                    <select>
                        <option>Physics</option>
                        <option>Chemistry</option>
                        <option>Maths</option>
                        <option>Biology</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Hobbies</td>
                <td><input type="checkbox">Playing chess
                     <input type="checkbox">Reading
                     <input type="checkbox">Cycling
                </td>   
            </tr>
            <br>
            <tr>
                <td>Address</td>
                <td><textarea rows="4" cols="4">complete it</textarea>
                </td>
            </tr>
            <tr>
                <td>Attach Profile</td>
                <td><input type="button" value="choose">&nbsp;<input type="checkbox">No file choosen
                </td>
            </tr>
            <tr>
                <td colspan="2" align="Center">
                    <input type="Reset"><input type="Submit">
                </td>
            </tr>
        </form>
    </table>
</body>
</html>
