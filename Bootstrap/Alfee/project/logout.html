<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Platform Admin Module - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <style>
    body {
      background-color: #f8f9fa;
    }
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .illustration-img {
      max-width: 100%;
      height: auto;
    }
    .card {
      border: none;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    h1 {
      font-weight: bold;
    }
    .btn-primary {
      background-color: #2B2BFF;
      border-color: #2B2BFF;
    }
  </style>
</head>
<body>

<div class="container login-container">
  <div class="row w-100 align-items-center">
    <div class="col-lg-6 text-center mb-4 mb-lg-0">
      <img class="img-fluid wid1"  src="images/Group 8.png"> 
      <img class="img-fluid wid1" src="images/Hire me Now.png" >
      <img src="images/Illustration.png" alt="Admin Illustration" class="illustration-img">
    </div>
    <div class="col-lg-6">
      <div class="card p-4">
        <h4 class="text-center mb-4">Sign in to AdminDashboard</h4>
        <form>
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" placeholder="Enter email">
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" placeholder="Enter password">
          </div>
          <div class="d-flex justify-content-end mb-3">
            <a href="#" class="text-muted small">Forgot password?</a>
          </div>
          <button type="submit" class="btn btn-primary w-100">Sign In</button>
        </form>
      </div>
    </div>
  </div>
</div>
</body>
</html>
