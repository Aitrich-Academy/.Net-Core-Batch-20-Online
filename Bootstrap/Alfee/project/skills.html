<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <title>Skills</title>
    <style>
      body {
        overflow-x: hidden;
      }
      .sidebar {
        height: 100vh;
        background-color: #0d3c79;
        color: white;
        padding-top: 30px;
        position: fixed;
        width: 220px;
        transition: all 0.3s;
      }
      .sidebar a {
        color: white;
        text-decoration: none;
        display: block;
        padding: 10px 20px;
        font-size: 16px;
      }
      .sidebar a:hover {
        background-color: #ffffff1a;
      }
      .content {
        margin-left: 220px;
        padding: 20px;
        transition: all 0.3s;
      }

      @media (max-width: 768px) {
        .sidebar {
          transform: translateX(-100%);
        }
        .sidebar.show {
          transform: translateX(0);
          z-index: 9999;
        }
        .content {
          margin-left: 0;
        }
        .menu-toggle {
          position: fixed;
          top: 15px;
          left: 15px;
          z-index: 10000;
          background-color: #0d3c79;
          color: white;
          border: none;
          padding: 10px;
          border-radius: 4px;
        }
      }
      .form-container{
        margin-top: 100px;
        margin-left: 40px;
        background-color:white;
        border-radius: 10px;
        box-sizing: border-box; 
      }
     
    </style>
  </head>
  <body>
  
  <button class="menu-toggle d-md-none" onclick="toggleSidebar()">
    <i class="bi bi-list fs-3"></i>
  </button>
  
  <div class="sidebar" id="sidebar">
    <div class="text-center mb-4">
      <img src="images/Group 8.png" alt="Jobie" style="width: 80px;">
      <img src="images/Jobie.png" alt="Jobie" style="width: 80px;">
    </div>
      <a href="#"><i class="bi bi-house-door"></i> Dashboard</a>
      <a href="#"><i class="bi bi-people"></i> Job Providers</a>
      <a href="#"><i class="bi bi-search"></i> Job Seekers</a>
      <a href="#"><i class="bi bi-grid"></i> Jobs</a>
      <a href="#"><i class="bi bi-gear"></i> Skills</a>
      <a href="#"><i class="bi bi-box-arrow-left"></i> Logout</a>
  </div>

  <div class="content">
    <form class="form-container">
        <div class="mb-3">
            <input type="text" class="form-control" placeholder="Skill Name" style="background-color: whitesmoke;">
        </div>
        <div class="mb-3">
            <textarea class="form-control" rows="3" placeholder="Skill Description" style="background-color: whitesmoke;"></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Add Skill</button>
        <a href="list skill.html" class="btn btn-primary">List</a>
    </form>
  </div>

  <script>
    function toggleSidebar() 
    {
      document.getElementById('sidebar').classList.toggle('show');
    }
  </script>
</body>
</html>
