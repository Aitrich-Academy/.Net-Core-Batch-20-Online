<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Responsive Admin Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <style>
    body {
      overflow-x: hidden;
    }
    .sidebar {
      height: 100vh;
      background-color: #0d3c79;
      color: white;
      padding-top: 30px;
      position: fixed;
      width: 220px;
      transition: all 0.3s;
    }
    .sidebar a {
      color: white;
      text-decoration: none;
      display: block;
      padding: 10px 20px;
      font-size: 16px;
    }
    .sidebar a:hover {
      background-color: rgba(255, 255, 255, 0.1);
    }
    .content {
      margin-left: 220px;
      padding: 20px;
      transition: all 0.3s;
    }
    .card-summary {
      background-color: #0d3c79;
      color: white;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
    }
    @media (max-width: 768px) {
      .sidebar {
        transform: translateX(-100%);
      }
      .sidebar.show {
        transform: translateX(0);
        z-index: 9999;
      }
      .content {
        margin-left: 0;
      }
      .menu-toggle {
        position: fixed;
        top: 15px;
        left: 15px;
        z-index: 10000;
        background-color: #0d3c79;
        color: white;
        border: none;
        padding: 10px;
        border-radius: 4px;
      }
    }
  </style>
</head>
<body>

<button class="menu-toggle d-md-none" onclick="toggleSidebar()">
  <i class="bi bi-list fs-3"></i>
</button>

<div class="sidebar" id="sidebar">
  <div class="text-center mb-4">
    <img src="images/Group 8.png" alt="Jobie" style="width: 80px;">
    <img src="images/Jobie.png" alt="Jobie" style="width: 80px;">
  </div>
    <a href="#"><i class="bi bi-house-door"></i> Dashboard</a>
    <a href="providers.html"><i class="bi bi-people"></i> Job Providers</a>
    <a href="seekers.html"><i class="bi bi-search"></i> Job Seekers</a>
    <a href="jobs.html"><i class="bi bi-grid"></i> Jobs</a>
    <a href="skills.html"><i class="bi bi-gear"></i> Skills</a>
    <a href="logout.html"><i class="bi bi-box-arrow-left"></i> Logout</a>
</div>

<div class="content">
  <h3 class="mb-4 fw-bold">Platform Admin</h3>
  <div class="row g-4 mb-4">
    <div class="col-md-3">
      <div class="card-summary">
        <i class="bi bi-briefcase-fill"></i>
        <h6 class="mt-2">Total Jobs Posted</h6>
        <h2>103</h2>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card-summary">
        <i class="bi bi-person-fill"></i>
        <h6 class="mt-2">Total Job Seekers</h6>
        <h2>53</h2>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card-summary">
        <i class="bi bi-building"></i>
        <h6 class="mt-2">Total Companies</h6>
        <h2>65</h2>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card-summary">
        <i class="bi bi-calendar-event-fill"></i>
        <h6 class="mt-2">Total Job Providers</h6>
        <h2>36</h2>
      </div>
    </div>
  </div>

  <div>
    <div class="row py-3">
      <div class="col-md-12 px-5">
          <img src="images/jobStatistic.png" class="img-fluid">
      </div>
  </div>
  </div>
</div>

<script>
  function toggleSidebar() 
  {
    document.getElementById('sidebar').classList.toggle('show');
  }
</script>
</body>
</html>
