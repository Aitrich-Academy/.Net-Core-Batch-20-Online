<!DOCTYPE html>
<html lang="en" style="overflow-x: hidden;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script> <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <title>List skills</title>
  <style>
    body {
      display: flex;
    }
    .sidebar {
      height: 100vh;
      background-color: #0d3c79;
      color: white;
      padding-top: 30px;
      position: fixed;
      width: 220px;
      transition: all 0.3s;
    }
    .sidebar a {
      color: white;
      text-decoration: none;
      display: block;
      padding: 10px 20px;
      font-size: 16px;
    }
    .sidebar a:hover {
      background-color: #ffffff1a;
    }
    .card {
      margin-bottom: 20px;
      min-width:300px;
    }  
    .content {
      margin-left: 220px;
      padding: 30px;
      transition: all 0.3s;
      background-color:white;
    }
    .card-summary {
      background-color: #0d3c79;
      color: white;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      box-shadow:0cap ;
    }
    
    @media (max-width: 768px) {
      .sidebar {
        transform: translateX(-100%);
      }
      .sidebar.show {
        transform: translateX(0);
        z-index: 9999;
      }
      .content {
        margin-left: 0;
      }
      .menu-toggle {
        position: fixed;
        top: 15px;
        left: 15px;
        z-index: 10000;
        background-color: #0d3c79;
        color: white;
        border: none;
        padding: 10px;
        border-radius: 4px;
      }
    }
  </style>
</head>
<body>
    <button class="menu-toggle d-md-none" onclick="toggleSidebar()">
      <i class="bi bi-list fs-3"></i>
    </button>
    <div class="sidebar" id="sidebar">
        <div class="text-center mb-4">
            <img src="images/Group 8.png" alt="Jobie" style="width: 80px;">
            <img src="images/Jobie.png" alt="Jobie" style="width: 80px;">
        </div>
          <a href="#"><i class="bi bi-house-door"></i> Dashboard</a>
          <a href="#"><i class="bi bi-people"></i> Job Providers</a>
          <a href="#"><i class="bi bi-file-earmark-plus"></i> New Registrations</a>
          <a href="#"><i class="bi bi-search"></i> Job Seekers</a>
          <a href="#"><i class="bi bi-grid"></i> Jobs</a>
          <a href="#"><i class="bi bi-person"></i> My Profile</a>
          <a href="#"><i class="bi bi-envelope"></i> Messages</a>
          <a href="#"><i class="bi bi-gear"></i> Settings</a>
          <a href="#"><i class="bi bi-box-arrow-left"></i> Logout</a>
    </div>
    <div class="content">
       <br><br>
        <div class="row">
            <div class="col-md-3">
                <div class="card p-3">
                   <p><strong>Skill Name:</strong> .NET</p>
                   <p><strong>Description:</strong> C# highlights </p>
                   <div class="d-flex justify-content-start mt-3">
                    <i class="bi bi-trash text-primary"></i>
                  </div>
                </div>
            </div>
  
            <div class="col-md-3">
                <div class="card p-3">
                   <p><strong>Skill Name:</strong> React</p>
                   <p><strong>Description:</strong> highlights</p>
                    <div class="d-flex justify-content-start mt-3">
                      <i class="bi bi-trash text-primary"></i>
                    </div>
                </div>
            </div>
  
            <div class="col-md-3">
                <div class="card p-3">
                    <p><strong>Skill Name:</strong> Angular</p>
                    <p><strong>Description:</strong> Typescrpt , CSS</p>
                    <div class="d-flex justify-content-start mt-3">
                        <i class="bi bi-trash text-primary"></i>
                    </div>
                </div>
            </div>
  
            <div class="col-md-3">
                <div class="card p-3">
                    <p><strong>Skill Name:</strong> C</p>
                    <p><strong>Description:</strong> 1</p>
                    <div class="d-flex justify-content-start mt-3">
                        <i class="bi bi-trash text-primary"></i>
                    </div>
                </div>
            </div>
            <div class="mt-4">
                <button type="submit" class="btn btn-primary">Add Skill</button>
            </div>
        </div>
    </div>  
    <script>
        function toggleSidebar() 
        {
          document.getElementById('sidebar').classList.toggle('show');
        }
    </script>
</body>
</html>
