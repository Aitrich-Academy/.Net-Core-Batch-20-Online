<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page 3 Table</title>

<style>
    .boxstyle
    {
     box-sizing: border-box;
     border-color: rgb(241, 241, 234);
     border-style:solid;
     width: 400px;
     height: 330px;
    }

    table 
    {
      margin: 34px auto;
      width: 50%;
      border: none;
     }

    td,th
    {
        padding: 10px;
        text-align: left;
        font-size: 20px;
    }

    th
    {
        background-color:#ddd;
        border-radius: 16px;
        border-style: none;
     } 

     td
     {
      color: gray;
     }

     td:first-child
     {
        color: blue;
        font-weight: bold;
      }

     tr:last-child td
     {
        border-bottom: 2px solid blue;
     }

     

     tr :nth-child(1)  
      {
        border-left: solid gray;
        border-right:  solid gray;;
        border-top: none;
        border-bottom: none;
      }
      tr :nth-child(2)
      {
        border-left: solid gray;
        border-right:  solid gray;;
        border-top: none;
        border-bottom: none;
      }

      tr :nth-child(3)
      {
        border-left: solid gray;
        border-right:  solid gray;;
        border-top: none;
        border-bottom: none;
      }
      tr :nth-child(4)
      {
        border-left: solid gray;
        border-right:  solid gray;;
        border-top: none;
        border-bottom: none;
      }
</style>
 
</head>

<body>
   <!-- .........table......  -->
<div class="boxstyle">
   <h1 style="font-size: 44px; margin-left: 30px;">Students Scores</h1>

   <table>
    <tr>
        <th>Name</th>
        <th>Math</th>
        <th>Science</th>
        <th>English</th>
    </tr>
     
    <tr>
        <td>John</td>
        <td>85</td>
        <td>92</td>
        <td>78</td>
    </tr>

     
    <tr>
        <td>Alice</td>
        <td>75</td>
        <td>88</td>
        <td>95</td>
    </tr>

     
    <tr>
        <td>Michael</td>
        <td>90</td>
        <td>85</td>
        <td>88</td>
    </tr>
   </table>
</div>
</body>

</html>
