<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>border styling </title>

    <style>
        .box1
          {
            border-style: double;
            width: 1000px;
            height: 230px;
            border-color:black;
            box-sizing: border-box;
            margin-left: 58px;
            margin-top: 58px;
          }

          .box2
          {
            border:3px solid;
            width: 871px;
            height: 180px;
            border-color: blue;
            box-sizing: border-box;
            margin-left: 51px;
            margin-right: 50px;
            margin-top: 26px;
            margin-bottom: 10px;
            border-radius: 26px;   
          }

          .text
          {
            font-size: 40px;
            position: relative;
            top:20px;
            left:295px;
          }

          .box3
          {
            border:3px solid;
            width: 800px;
            height: 49px;
            border-color: blue;
            box-sizing: border-box;
            margin-left: 29px;
            border-right: none;
            border-bottom: none;
           }
    </style>

</head>

<body>

    <div class="box1">
        <div class="box2">
            <h1 class="text">Decorative Borders</h1>
            <div class="box3">
                <p style="font-size: 21px; font-weight: normal; position: relative; left: 236px; top: -17px;">This is an example of using decorative borders.<p>
            </div> 
        </div>

    </div>
    
</body>

</html>
