<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./style.css" rel="stylesheet" type="text/css" />
    <title>Document</title>
  </head>
  <body>
    <div class="parent">
      <img
        src="./system.png"
        width="40px"
        height="40px"
        style="position: absolute; left: 45%; top: 20px"
      />
      <h3 style="text-align: center; position: absolute; left: 35%; top: 60px">
        Welcome Back
      </h3>

      <div class="box_3">
        <img
          src="./google.png"
          width="15px"
          height="15px"
          style="position: absolute; margin-left: 36px; margin-top: 11px"
        />
        <h4 class="h4">Log in with google</h4>
      </div>

      <div class="sub">OR LOGIN WITH A EMAIL</div>

      <form>
        <input class="box_4" type="email" placeholder="Your email" >

        <input class="box_5" type="password" placeholder="Your Password" style="margin-top: 10px;">

        <input class="box_6" type="checkbox">  <label class="box_6_label">Keep logged in</label>

        <button class="btn_login">Login</button>
      </form>
    </div>

    <div class="parent_2">
        <form>
            <h5>Job Title</h5>
            <input class="box_7" type="text" placeholder="Enter job title">

            <h5>Description</h5>
            <input class="box_7" type="text" placeholder="Enter Description">

            <h5>Salary</h5>
            <input class="box_7" type="text" placeholder="Enter Salary">

        </form>
    </div>

    <div class="parent_3">
        <form>
            <p class="box_8"><img src="./profilePicture.png">
                <h3 class="name">Carlie John</h3></p>

                <hr class="line">

                <h4 class="name_2">Basic Information</h4>
                <h6 class="name_3">Loreum Ipsum is simply dummy text</h6>

                <p class="name_4">Full Name</p>
                <input class="box_9" type="text" placeholder="Your Name">

                <p class="name_5">Email Address</p>
                <input class="box_10" type="text" placeholder="Example@gmail.com">

                <p class="name_6">About Biography</p>
                <input class="box_11" type="text" placeholder="Say something about you...">

                <button class="bttn_save">Save Changes</button>
              
        </form>
    </div>
  </body>
</html>
