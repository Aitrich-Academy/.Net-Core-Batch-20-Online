<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    .spinner {
        width: 50px;
        height: 50px;
        border: 5px solid rgba(0, 0, 0, 0.1);
        border-top-color: #3498db;
        border-radius: 50%;
        margin-left: 500px;
        animation: spin 10s infinite;
        
}
.fade
{
    text-align: left;
    animation:fadeinout 5s infinite ;
    

}
    @keyframes fadeinout
        {
            0% { opacity: 0; }
            50% { opacity: 1; }
            100% { opacity: 0; }
        }
    

@keyframes spin{
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }
.slidetext
{
    font-size: xx-large;
    color: yellowgreen;
    animation:slidet 12s infinite;
    
}
        
        @keyframes slidet {
            0% { transform: translateX(-100%);color: blue; }
            100% { transform: translateX(100%);  }
 
             
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.3);  }
            100% { transform: scale(1);  }
        }

        .pulse-circle {
            width: 100px;
            height: 100px;
            background-color: #3498db;
            border-radius: 50%;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            color: white;
            font-weight: bold;
            animation: pulse 1.5s infinite ease-in-out;
        }
        .bouncing{
            height:100px;
            width:100px;
         
            background-color: rgb(197, 185, 11);
            border-radius: 55px;
            position: absolute;
            
            animation:move 5s infinite;

        }
        @keyframes move {
  0%   {top: 0px;background-color: brown;}
  25%  {top: 200px;background-color: yellow;}
  75%  {top: 50px;background-color: slateblue;}
  100% {top: 100px;background-color: violet;}
        }
    
</style>
</head>
<body>
   <h1>11.Bouncing Ball</h1> 
    <div class="bouncing"></div>
<h1>12.Loading Spinner</h1>
    <div class="spinner"></div>
    <h1>13.	Fade In and Out</h1>
    <div class="fade" ><img src="activities/image/download.jpg"></div>
    <h1>14.	Sliding Text</h1>
    <div class="slidetext">WELCOME</div>
    <h1>15.	Pulse Effect: </h1>
    <div class="pulse-circle">Pulse</div>
</body>
</html>
