<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
  
    .carousel {
        position: relative;
        width: 300px;
        height: 200px;
        overflow: hidden;
        border: 2px solid #fff;
    }

    .slides {
        display: flex;
        width: 900px;
        animation: slide 6s infinite;
    }

    .slide {
        width: 300px;
        height: 200px;
    }

    .slide img {
        width: 100%;
        height: 100%;
    }

    @keyframes slide {
        0% { transform: translateX(0); }
        33% { transform: translateX(-300px); }
        66% { transform: translateX(-600px); }
        100% { transform: translateX(0); }
    }
</style>
</head>
<body>
<div class="carousel">
    <div class="slides">
        <div class="slide"><img src="image/download (1).jpg" alt="Image 1"></div>
        <div class="slide"><img src="image/download.jpg" alt="Image 2"></div>
        <div class="slide"><img src="image/images.jpg" alt="Image 3"></div>
    </div>
</div>

    
</body>
</html>
