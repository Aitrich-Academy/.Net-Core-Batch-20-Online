<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .flipimage

    {
      transition:5s ease;
      position:fixed;
      
    }
    .flipimage:hover
    {
        transform:rotatey(180deg)
    }

.nav {
            display: flex;
            background: #333;
            padding: 10px;
            border-radius: 8px;
        }
        .nav a {
            position: relative;
            color: white;
            padding: 15px 20px;
            transition: transform 0.3s ease-in-out;
        }
        .nav a:hover {
            transform: translateY(-5px);
        }
        .button {
            position: relative;
            padding: 15px 30px;
            font-size: 18px;
            color: white;
            background-color: #3498db;
            border: none;
            cursor: pointer;
            outline: none;
            overflow: hidden;
            border-radius: 8px;
        }

        .button::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            transform: scale(1);
            opacity: 0;
            pointer-events: none;
        }

        @keyframes ripple {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            100% {
                transform: scale(15);
                opacity: 0;
            }
        }

        .button:hover::before {
            animation: ripple 0.6s ease-out;
        }
      

</style>
<body>
  <div><nav class="nav">
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Services</a>
    <a href="#">Contact</a>
</nav>

</div>
   
    
<h2>Animated Button - Ripple Effect</h2>

<button class="button">Hover Me</button>
<h1>16.Image Flip</h1><br>

<div class="flipimage">
  <img src="image/download.jpg"></div>

<br>
<br>

</html>
