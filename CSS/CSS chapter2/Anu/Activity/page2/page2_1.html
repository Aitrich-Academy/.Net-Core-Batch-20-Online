<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page 2 Hyperlink 2</title>

     <style>
     .samplebox1
    {
       box-sizing: border-box;
       border-color: rgb(14, 14, 10);
       border-style:inset;
       width: 500px;
       padding: 5px;
       padding-left: 26px;
       margin-top:20px ;
       margin-left: 20px;
     }


     a:link
            {
             background-color: blueviolet;
            }

           a:visited
           {
            background-color: green;
           }
           a:hover
           {
            background-color: red;
           }
           a:active
           {
            background-color: yellow;
           }

    </style>

   
</head>

<body>
    <div class="samplebox1">

        <h2>Welcome to My Website</h2>

        <p>
            This is a site for Educational Training Institution <a href="https://aitrich.com/" >aitrich</a> for styling.
        </p>

    </div>
